name: wip-ios

run-name: wip-ios-build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch
        required: true
        default: main

      environment:
        description: Environments
        type: choice
        options:
          - production
          - preview
          - development
        default: production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: setup-nodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications
      
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      
      - name: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: remove-ios-folder
        run: rm -rf ios

      - name: install-dependencies
        run: |
          npm install -g eas-cli
          yarn install --frozen-lockfile

      - name: regenerate-native-project
        run: |
          npx expo prebuild --platform ios --clean

      - name: setup-cocoapods
        run: |
          sudo gem install cocoapods

      - name: install-pods
        run: |
          cd ios 
          pod install

      - name: versioning
        run: |
          VERSION=$(npx expo config --json | jq -r '.version')
          BUILD=$((100 + ${{ github.run_number }}))

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

          echo "Version: $VERSION"
          echo "Build: $BUILD"

      - name: build-local
        env:
          BUILD: ${{ env.BUILD }}
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          xcodebuild -version
      
          eas build \
            -p ios \
            --profile ${{ github.event.inputs.environment }} \
            --local \
            --non-interactive

      - name: collect-artifact
        run: |
          IPA=$(find . -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ipa not found"
            exit 1
          fi

          cp "$IPA" \
            "wip-${VERSION}-${BUILD}-${{ github.event.inputs.environment }}.ipa"

      - name: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: wip-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}-ios
          path: |
            wip-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}.ipa
